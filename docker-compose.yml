# CloakBrowser CDP + crawl4ai-mcp Streamable HTTP.
# Docs: https://github.com/CloakHQ/cloakbrowser (Docker Compose / cloakserve)
#
# Pin 0.6.5 = last keyless wrapper (old v146 binary). From 0.7+, a license key
# is required — see CHANGELOG / README "Can I still use the old keyless v146 build?"
#
#   docker compose up -d --build
#   docker compose logs -f mcp

services:
  cloakbrowser:
    image: cloakhq/cloakbrowser:0.6.5
    command: cloakserve
    restart: unless-stopped
    ports:
      # CDP is full browser control — bind localhost only (official security note)
      - "127.0.0.1:9222:9222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 8
      # First start may download the v146 binary from GitHub Releases
      start_period: 180s

  mcp:
    build: .
    restart: unless-stopped
    depends_on:
      cloakbrowser:
        condition: service_healthy
    environment:
      CDP_URL: http://cloakbrowser:9222
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Optional fixed Bearer token; otherwise auto-generated into /data
      API_KEY: ${API_KEY:-}
      CONFIG_DIR: ${CONFIG_DIR:-}
      CRAWL4AI_MCP_DATA_DIR: /data
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mcp-data:/data
      # Optional: mount custom site YAML (set CONFIG_DIR=/config in .env)
      # - ./configs-user:/config:ro

volumes:
  mcp-data:
